mission_manager:
  ros__parameters:
    start_signal_red_hold_sec: 0.3
    start_signal_green_hold_sec: 0.3

    cone_enter_hold_sec: 0.25
    cone_exit_hold_sec: 0.7
    cone_min_dwell_sec: 1.0
    cone_reenter_cooldown_sec: 1.0

    drive_recover_hold_sec: 0.4
    lane_fallback_ready_hold_sec: 0.2
    lane_source_loss_grace_sec: 1.0

    minimum_camera_cone_count: 4
    maximum_camera_cone_count_for_exit: 1

    status_log_period_sec: 1.0

mission_start_signal_adapter:
  ros__parameters:
    source_state_topic: /track_drive/traffic_light_debug/state
    output_signal_topic: /mission/input/start_signal
    output_valid_topic: /mission/input/start_signal_valid
    source_timeout_sec: 0.5
    publish_rate_hz: 20.0

mission_drive_policy_adapter:
  ros__parameters:
    # simulation/il_data_tools policy_inference_node output.
    # The source node must run with drive_enabled:=false.
    source_debug_topic: /il/policy_debug
    output_valid_topic: /mission/input/drive_policy_valid
    source_timeout_sec: 0.5
    publish_rate_hz: 20.0

mission_lane_fallback_adapter:
  ros__parameters:
    source_centerline_topic: /perception/centerline
    source_road_segments_topic: /perception/road_segments
    source_command_topic: /lane_fallback/command
    output_valid_topic: /mission/input/lane_fallback_valid
    source_timeout_sec: 0.4
    command_timeout_sec: 0.2
    minimum_point_count: 3
    minimum_confidence: 0.25
    max_steering_angle_deg: 26.0
    publish_rate_hz: 20.0

lane_fallback_controller:
  ros__parameters:
    source_centerline_topic: /perception/centerline
    output_command_topic: /lane_fallback/command
    expected_frame_id: base_footprint
    source_timeout_sec: 0.4
    minimum_confidence: 0.25
    minimum_point_count: 3
    wheelbase_m: 0.33
    near_lookahead_m: 0.70
    far_preview_distance_m: 0.75
    max_lookahead_m: 1.45
    far_preview_weight: 0.65
    steering_gain: 1.0
    max_steering_angle_deg: 26.0
    minimum_path_distance_m: 0.70
    publish_rate_hz: 20.0

final_driver:
  ros__parameters:
    decision_topic: /mission/decision
    il_debug_topic: /il/policy_debug
    lane_command_topic: /lane_fallback/command
    cone_command_topic: /my_rule/cone_cmd
    motor_topic: /xycar_motor

    publish_rate_hz: 50.0
    decision_timeout_sec: 0.2
    il_source_timeout_sec: 0.5
    lane_command_timeout_sec: 0.2
    lane_max_steering_angle_deg: 26.0

    cone_source_timeout_sec: 0.2
    cone_minimum_confidence: 0.2
    cone_max_steering_angle_deg: 26.0
    cone_minimum_requested_speed: 9.5
    cone_maximum_requested_speed: 21.0

    physical_angle_deg: [0.0, 4.0, 10.0, 16.0, 26.0]
    xycar_steering_command: [0.0, 10.0, 20.0, 30.0, 42.0]
    physical_steering_sign: 1.0

    # Intentionally omitted: fallback_speed.
    # Pass fallback_speed:=<vehicle-tested value> to the drive launch.

mission_camera_cone_adapter:
  ros__parameters:
    source_count_topic: /perception/camera_cone_count
    output_count_topic: /mission/input/camera_cone_count
    output_valid_topic: /mission/input/camera_cone_valid
    source_timeout_sec: 0.2
    publish_rate_hz: 20.0

mission_lidar_cone_adapter:
  ros__parameters:
    # hwj/my_rule cone_node outputs. Do not run rule_driver with the Final Driver.
    source_command_topic: /my_rule/cone_cmd
    source_cluster_topic: /my_rule/cone_clusters
    output_source_valid_topic: /mission/input/lidar_cone_source_valid
    output_path_ready_topic: /mission/input/lidar_cone_path_ready
    output_present_topic: /mission/input/lidar_cone_present
    source_timeout_sec: 0.2
    path_ready_confidence: 0.35
    presence_confidence: 0.2
    presence_min_clusters: 2
    publish_rate_hz: 20.0

xycar_motor_bridge:
  ros__parameters:
    use_sim_time: true
    motor_topics:
      - xycar_motor
      - /xycar_motor
    cmd_vel_topic: /model/xycar_ackermann/cmd_vel
    wheel_base: 0.32

    angle_command_min: -50.0
    angle_command_max: 100.0
    # Linear fallback retained for comparisons with the VESC conversion code.
    steering_gain: -0.0068
    steering_min: -0.56
    steering_max: 0.56

    # 2026-07-12 low-angle and 2026-07-13 high-angle real-car medians,
    # represented as command -> path curvature (1/m).
    # Signs follow the existing Xycar command convention: positive angle turns right.
    use_measured_steering_map: true
    steering_map_commands: [-42.0, -40.0, -35.0, -30.0, -20.0, -10.0, 0.0, 10.0, 20.0, 30.0, 35.0, 40.0, 42.0]
    steering_map_curvatures: [1.502435, 1.383494, 1.174860, 0.922781, 0.552809, 0.194230, 0.0, -0.556883, -0.959829, -1.369323, -1.601706, -1.853397, -1.939236]

    speed_command_min: -50.0
    speed_command_max: 100.0
    speed_gain: 0.080612
    # Commands 0, 1, and 2 did not launch the real vehicle; command 3 did.
    speed_deadzone_command: 3.0
    speed_min: -4.0
    speed_max: 8.0

    steering_delay_sec: 0.10
    speed_delay_sec: 0.20
    # First-order constants inferred from valid 10-90% response trials.
    speed_accel_tau_sec: 0.19
    speed_brake_tau_sec: 0.09
    command_update_period_sec: 0.005
    cmd_timeout_sec: 0.5
    debug_topic: /xycar_motor_bridge/debug

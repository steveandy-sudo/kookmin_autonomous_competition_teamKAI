slam_toolbox:
  ros__parameters:
    use_sim_time: false
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: HuberLoss

    odom_frame: slam_odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /slam/scan_filtered
    use_map_saver: true
    mode: mapping

    debug_logging: false
    resolution: 0.05
    min_laser_range: 0.21
    max_laser_range: 6.0
    minimum_time_interval: 0.10
    transform_publish_period: 0.02
    map_update_interval: 0.5
    transform_timeout: 0.20
    tf_buffer_duration: 300.0
    throttle_scans: 1
    scan_queue_size: 100
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # Use LiDAR to hold lateral position and heading, but bound every update so
    # one 20 cm doorway cannot pull the vehicle to another repeated doorway.
    use_scan_matching: true
    constrain_scan_matching: true
    sequential_graph_only: true
    scan_match_minimum_response: 0.20
    scan_match_maximum_longitudinal_correction: 0.04
    scan_match_maximum_lateral_correction: 0.08
    scan_match_maximum_heading_correction: 0.017453292519943295
    use_scan_barycenter: true
    minimum_travel_distance: 0.20
    minimum_travel_heading: 0.05
    scan_buffer_size: 150
    scan_buffer_maximum_scan_distance: 12.0
    link_match_minimum_response_fine: 0.20
    link_scan_maximum_distance: 1.00

    # A candidate must agree with about 6 m of ordered 20 cm doorway context,
    # not just one similar recess. The odometry gate prevents an unrestricted
    # search across every visually identical hallway section.
    do_loop_closing: true
    loop_search_maximum_distance: 8.0
    loop_match_minimum_chain_size: 30
    loop_match_maximum_variance_coarse: 0.10
    loop_match_minimum_response_coarse: 0.80
    loop_match_minimum_response_fine: 0.70

    # If odometry has already drifted beyond the local search gate, compare
    # about 6 m of ordered LiDAR scans against older sequences. A candidate
    # still needs to pass the normal coarse and fine Karto matchers.
    global_loop_closing: true
    global_loop_search_period_nodes: 10
    global_loop_minimum_separation_nodes: 250
    global_loop_sequence_size: 30
    global_loop_candidate_stride: 5
    global_loop_maximum_range_error: 0.18
    global_loop_minimum_error_margin: 0.008

    correlation_search_space_dimension: 0.50
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.05
    loop_search_space_dimension: 10.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.0873
    coarse_angle_resolution: 0.01745
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: false

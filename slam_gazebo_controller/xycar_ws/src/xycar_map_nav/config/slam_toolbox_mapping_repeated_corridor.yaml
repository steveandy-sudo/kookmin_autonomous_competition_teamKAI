slam_toolbox:
  ros__parameters:
    use_sim_time: false
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: slam_odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /slam/scan_filtered
    use_map_saver: true
    mode: mapping

    debug_logging: false
    resolution: 0.05
    min_laser_range: 0.21
    max_laser_range: 6.0
    minimum_time_interval: 0.10
    transform_publish_period: 0.02
    map_update_interval: 0.5
    transform_timeout: 0.20
    tf_buffer_duration: 30.0
    throttle_scans: 1
    scan_queue_size: 5
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # The recorded repeated-door corridor produced 2.5-3.0 m longitudinal
    # snaps even with a bounded matcher. Preserve calibrated VESC+IMU odometry
    # while collecting the graph, then close it once at a unique landmark.
    use_scan_matching: false
    use_scan_barycenter: true
    # Adjacent 8 cm scans did not contain enough longitudinal structure and
    # repeatedly snapped to neighboring 20 cm door recesses. At 20 cm the
    # local match contains measurable translation while still being smooth.
    minimum_travel_distance: 0.20
    minimum_travel_heading: 0.05
    scan_buffer_size: 100
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.20
    link_scan_maximum_distance: 1.00

    # Repeated doors are not unique loop-closure landmarks. Collect their
    # scans in the odometry pose graph, then close the completed lap manually
    # at a unique corner or start marker with the interactive Toolbox panel.
    do_loop_closing: false
    loop_search_maximum_distance: 0.0
    loop_match_minimum_chain_size: 15
    loop_match_maximum_variance_coarse: 0.16
    loop_match_minimum_response_coarse: 0.70
    loop_match_minimum_response_fine: 0.55

    # These values are retained for explicit experimental profiles. They do
    # not alter poses while use_scan_matching is false.
    correlation_search_space_dimension: 0.50
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.05
    loop_search_space_dimension: 4.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.0873
    coarse_angle_resolution: 0.01745
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true

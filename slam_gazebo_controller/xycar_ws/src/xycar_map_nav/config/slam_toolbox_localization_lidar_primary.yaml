slam_toolbox:
  ros__parameters:
    use_sim_time: false
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: slam_odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /slam/scan_filtered
    mode: localization
    map_file_name: ""
    map_start_pose: [0.0, 0.0, 0.0]

    debug_logging: false
    resolution: 0.05
    min_laser_range: 0.21
    max_laser_range: 6.0
    minimum_time_interval: 0.10
    transform_publish_period: 0.02
    map_update_interval: 1.0
    transform_timeout: 0.20
    tf_buffer_duration: 30.0
    throttle_scans: 1
    scan_queue_size: 5
    stack_size_to_use: 40000000

    # VESC+IMU odometry centers the search. LiDAR correlation is allowed to
    # correct a substantially larger local translation and heading error.
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.04
    minimum_travel_heading: 0.04
    scan_buffer_size: 40
    scan_buffer_maximum_scan_distance: 8.0
    link_match_minimum_response_fine: 0.25
    link_scan_maximum_distance: 1.50

    correlation_search_space_dimension: 0.80
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.08
    distance_variance_penalty: 1.0
    angle_variance_penalty: 2.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.95
    minimum_distance_penalty: 0.80
    use_response_expansion: true

xycar_camera_perception:
  ros__parameters:
    use_sim_time: false
    image_topic: /wide_camera/rect/image_raw
    use_compressed_image: false
    road_segments_topic: /perception/road_segments
    centerline_topic: /perception/centerline
    objects_topic: /perception/objects
    traffic_lights_topic: /perception/traffic_lights
    rectified_image_topic: /perception/rectified_camera_image
    debug_image_topic: /perception/debug_image
    debug_markers_topic: /perception/debug_markers
    canonical_road_topic: /perception/canonical_road_image
    canonical_white_mask_topic: /perception/canonical_white_mask
    canonical_yellow_mask_topic: /perception/canonical_yellow_mask
    canonical_tracking_debug_topic: /perception/canonical_tracking_debug
    base_frame_id: base_footprint
    source_name: xycar_camera_perception
    # Process every freshest frame; the depth-1 sensor queue prevents stale backlog.
    publish_rate_limit_hz: 0.0
    publish_empty_optional_topics: true

    # Initial real-car profile. Retune these ratios from a stationary debug image
    # if the physical camera pitch or mounting position has changed.
    roi_top_row: 0
    roi_bottom_row: 219
    row_step_px: 6
    image_center_x_px: -1.0
    projection_mode: bev_homography
    horizon_row_px: 236.0
    vanishing_point_x_px: -1.0
    ipm_x_scale_m_px: 67.0
    ipm_y_scale_m_px: 0.18
    horizon_min_denom_px: 8.0
    min_projected_x_m: 0.20
    max_projected_x_m: 5.00
    calib_yaml: ""
    # /wide_camera/rect/image_raw is already rectified by app_wide_camera_calib.
    enable_rectify: false
    rect_balance: 0.3
    # Calibrated on 2026-07-14 from transverse marks placed every 0.50m from
    # the camera lens. The top pair is at 1.5m and the bottom pair at 0.5m.
    # A 1.5m view contains two or three 0.30m dashes without the excess seen
    # in the earlier 2.0m preview.
    src_tl_x_ratio: 0.442578
    src_tr_x_ratio: 0.688281
    src_bl_x_ratio: 0.190625
    src_br_x_ratio: 0.919141
    src_top_y_ratio: 0.480781
    src_bottom_y_ratio: 0.614189
    bev_width: 640
    bev_height: 220
    # Preserve the measured 2026-07-14 source-to-BEV calibration anchors.
    # The shared real-track topology gate is configured separately below.
    dst_left_ratio: 0.205714
    dst_right_ratio: 0.794286
    dst_top_y_ratio: 0.0
    # 0.5m is row 146.7 in a 220-row, 1.5m BEV. Rows below it are retained as
    # invalid because the physical camera cannot see the near-field floor.
    dst_bottom_y_ratio: 0.666666667
    lateral_m_per_px: 0.0021875
    forward_m_per_px: 0.006818182
    bev_x_offset_m: 0.0
    bev_bottom_ignore_px: 0
    bev_border_gray: 70
    bev_valid_erode_px: 4

    near_x_m: 0.20
    far_x_m: 2.20
    near_m_per_px: 0.0022
    far_m_per_px: 0.0065
    lane_width_m: 0.80
    min_cluster_width_px: 3
    max_cluster_gap_px: 8
    min_segment_points: 4
    min_centerline_points: 3

    white_s_max: 120
    white_v_min: 145
    # Tuned on 40 evenly sampled frames from two 2026-07-14 bags (4,431 frames).
    yellow_h_min: 16
    yellow_h_max: 38
    yellow_s_min: 62
    yellow_v_min: 70
    morphology_kernel_px: 3
    centerline_mode: lane_midline
    use_yellow_as_centerline: false
    centerline_polyfit_enabled: true
    centerline_polyfit_degree: 2
    centerline_sample_spacing_m: 0.05
    centerline_temporal_alpha: 0.45
    centerline_temporal_timeout_sec: 0.50

    # Must match the simulation canonical contract exactly.
    canonical_width: 256
    canonical_height: 144
    canonical_lateral_range_m: 1.4
    canonical_forward_range_m: 1.5
    canonical_background_gray: 36
    canonical_line_width_px: 5
    # Prefer narrow, locally brighter tape over broad ceiling-light reflections.
    canonical_white_s_max: 80
    canonical_white_v_min: 245
    canonical_white_v_floor: 95
    canonical_white_relative_delta: 20.0
    canonical_white_min_component_median_v: 140.0
    canonical_min_component_area_px: 12
    canonical_white_max_component_thickness_px: 28.0
    canonical_yellow_max_component_thickness_px: 24.0
    # Keep at most one coherent white boundary per side and elongated yellow
    # dashes. This rejects narrow ceiling reflections that pass the HSV filter.
    canonical_geometry_filter_enabled: true
    canonical_white_min_line_span_px: 14
    canonical_yellow_min_line_span_px: 7
    canonical_min_line_elongation: 1.8
    canonical_min_line_verticality: 0.30
    # Preserve several candidates so the temporal tracker can reject a bright
    # reflection without discarding the real outer boundary first.
    canonical_white_max_components_per_side: 3
    canonical_yellow_max_components: 5
    canonical_white_clutter_component_limit: 0
    canonical_white_max_mask_fraction: 0.08
    canonical_yellow_max_mask_fraction: 0.06
    canonical_max_line_fit_rmse_px: 4.0
    canonical_top_ignore_m: 0.0
    canonical_bottom_ignore_m: 0.0
    canonical_tracking_enabled: true
    # Shared real-track profile, calibrated on the temporary modular track.
    canonical_expected_half_lane_width_m: 0.49
    canonical_lane_width_tolerance_m: 0.14
    canonical_min_white_yellow_offset_m: 0.18
    canonical_tracking_base_gate_m: 0.08
    canonical_tracking_max_gate_m: 0.25
    canonical_tracking_continuation_m: 0.38
    canonical_yellow_fit_gate_m: 0.08
    # Curved dashed lines need a slightly wider lateral association gate than
    # straight lines. The extra allowance is capped to reject remote clutter.
    canonical_tracking_curvature_gate_gain: 1.0
    canonical_tracking_curvature_max_extra_m: 0.10
    # Geometry-filtered candidates and physical lines matching a width
    # prediction are accepted immediately on their first frame.
    canonical_tracking_confirmation_frames: 1
    # Observation-only model input: publish current-frame detections without
    # coasting, temporal prediction, or a synthesized hidden boundary.
    canonical_tracking_coast_sec: 0.0
    canonical_tracking_search_sec: 0.0
    canonical_tracking_smoothing_alpha: 1.0
    canonical_width_prediction_enabled: false
    canonical_width_prediction_replacement_frames: 1
    # Ignore checkerboard / transverse start-line frames and hold the previous
    # longitudinal lane curves until normal lane pixels return.
    canonical_transverse_clutter_row_fraction: 0.12
    canonical_transverse_clutter_min_rows: 6
    canonical_persistent_prediction_enabled: false

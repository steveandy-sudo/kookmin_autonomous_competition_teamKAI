xycar_camera_perception:
  ros__parameters:
    use_sim_time: true
    image_topic: /image_raw
    use_compressed_image: false
    road_segments_topic: /perception/road_segments
    centerline_topic: /perception/centerline
    objects_topic: /perception/objects
    traffic_lights_topic: /perception/traffic_lights
    debug_image_topic: /perception/debug_image
    debug_markers_topic: /perception/debug_markers
    canonical_road_topic: /perception/canonical_road_image
    canonical_white_mask_topic: /perception/canonical_white_mask
    canonical_yellow_mask_topic: /perception/canonical_yellow_mask
    base_frame_id: base_footprint
    source_name: xycar_camera_perception
    # Process every freshest frame; the depth-1 sensor queue prevents stale backlog.
    publish_rate_limit_hz: 0.0
    publish_empty_optional_topics: true

    # BEV ROI after the real-car homography-style projection.
    roi_top_row: 0
    roi_bottom_row: 219
    row_step_px: 6
    image_center_x_px: -1.0

    # Real-car style wide-camera projection path:
    # raw image -> optional fisheye rectification -> homography BEV.
    projection_mode: bev_homography
    horizon_row_px: 236.0
    vanishing_point_x_px: -1.0
    ipm_x_scale_m_px: 67.0
    ipm_y_scale_m_px: 0.18
    horizon_min_denom_px: 8.0
    min_projected_x_m: 0.20
    max_projected_x_m: 5.00
    calib_yaml: ""
    # Gazebo already renders the configured camera projection. Applying the
    # physical fisheye calibration again creates invalid black arcs in the BEV.
    enable_rectify: false
    rect_balance: 0.3
    src_tl_x_ratio: 0.39
    src_tr_x_ratio: 0.67
    src_bl_x_ratio: -0.10
    src_br_x_ratio: 1.10
    src_top_y_ratio: 0.48
    src_bottom_y_ratio: 0.72
    bev_width: 640
    bev_height: 220
    dst_left_ratio: 0.10
    dst_right_ratio: 0.90
    # Metric scale calibrated from the 0.30 m dashes and 0.40 m half-road width.
    lateral_m_per_px: 0.0022
    forward_m_per_px: 0.010
    bev_x_offset_m: 0.0
    bev_bottom_ignore_px: 28
    bev_border_gray: 70
    bev_valid_erode_px: 8

    # Row-linear projection calibration.
    near_x_m: 0.20
    far_x_m: 2.20
    near_m_per_px: 0.0022
    far_m_per_px: 0.0065
    lane_width_m: 0.80

    min_cluster_width_px: 3
    max_cluster_gap_px: 8
    min_segment_points: 4
    min_centerline_points: 3

    white_s_max: 80
    white_v_min: 145
    yellow_h_min: 15
    yellow_h_max: 42
    yellow_s_min: 60
    yellow_v_min: 110
    morphology_kernel_px: 3
    centerline_mode: lane_midline
    use_yellow_as_centerline: false
    centerline_polyfit_enabled: true
    centerline_polyfit_degree: 2
    centerline_sample_spacing_m: 0.05
    centerline_temporal_alpha: 0.45
    centerline_temporal_timeout_sec: 0.50

    # Fixed metric representation shared by simulation and the real vehicle.
    canonical_width: 256
    canonical_height: 144
    canonical_lateral_range_m: 1.4
    canonical_forward_range_m: 1.2
    canonical_background_gray: 36
    canonical_line_width_px: 5
    canonical_white_s_max: 120
    canonical_white_v_min: 145
    canonical_white_v_floor: 70
    canonical_white_relative_delta: 9.0
    canonical_min_component_area_px: 8
    canonical_bottom_ignore_m: 0.08

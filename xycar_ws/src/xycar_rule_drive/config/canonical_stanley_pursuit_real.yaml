canonical_stanley_pursuit_driver:
  ros__parameters:
    use_sim_time: false

    # A valid outer-white fit may extend a short yellow curve. The existing
    # separation and temporal consistency checks still reject unrelated edges.
    extend_fused_path_to_white: true
    temporal_path_ego_compensation_enabled: true
    prefer_remembered_yellow_on_loss: true

    # The 2026-07-24 bags measured about 0.37 s from camera exposure to yaw
    # response. Start below that estimate and validate at speed 4, 6, then 8.
    control_latency_preview_sec: 0.35
    steering_lead_time_sec: 0.08
    steering_max_lead_command: 6.0

    # Match the stable real-car profile recorded in rule_test_01. Straight-only
    # control still uses its independent straight Stanley parameters.
    lookahead_distance_m: 0.30
    pure_pursuit_weight: 0.80
    # Use the net heading change over a long baseline. Taking the maximum of
    # three short segments classified straight-path fitting noise as a curve.
    curve_detection_near_x_m: 0.20
    curve_detection_far_x_m: 1.20
    curve_detection_segment_count: 1
    # A confirmed far curve temporarily moves the PP target forward. A short
    # or noisy path cannot activate this preview.
    adaptive_curve_lookahead_enabled: true
    adaptive_curve_lookahead_m: 0.75
    adaptive_curve_minimum_path_reach_m: 1.00
    adaptive_curve_confirmation_frames: 2
    adaptive_curve_release_frames: 2
    # The 2026-08-07 bags under-steered the first half of the S curve. Boost
    # only yellow-referenced curve commands; never amplify a white fallback.
    curve_steering_multiplier_enabled: true
    curve_steering_multiplier_activation_command: 10.0
    curve_steering_multiplier: 1.20
    curve_steering_yellow_reference_only: true

    # Begin the second S-curve steering only when the far yellow-centerline
    # curvature and Pure Pursuit request the same reversal for two frames.
    yellow_curve_reversal_preview_enabled: true
    yellow_curve_reversal_preview_near_x_m: 0.45
    # Use the farthest available 20 cm segment up to 0.90 m. This leaves time
    # for two-frame confirmation and the measured steering response delay.
    yellow_curve_reversal_preview_far_x_m: 0.90
    yellow_curve_reversal_preview_window_m: 0.20
    yellow_curve_reversal_preview_curvature_per_m: 0.12
    yellow_curve_reversal_preview_pursuit_rad: 0.12
    yellow_curve_reversal_preview_minimum_command: 10.0
    yellow_curve_reversal_preview_confirmation_frames: 2
    yellow_curve_reversal_preview_pursuit_weight: 0.75

    # Real-track baseline after integrated rule-drive tuning.
    target_right_offset_m: 0.0
    target_left_offset_m: 0.12

    # Safe first real-car defaults. The launch arguments can raise these only
    # after shadow output and curve completion have been checked.
    cruise_speed_command: 16.0
    minimum_speed_command: 8.0
    curve_slowdown_angle_command: 18.0
    lane_loss_speed_command: 4.0
    command_rate_hz: 10.0
    command_on_canonical: true

my_rule_cone_path_visualizer:
  ros__parameters:
    path_topic: /my_rule/cone_path
    cluster_topic: /my_rule/cone_clusters
    command_topic: /my_rule/cone_cmd
    marker_topic: /my_rule/cone_path_markers

    # cone_node publishes the path in rear_axle coordinates. The visualizer
    # shifts it into laser_frame so RViz does not require a rear_axle TF.
    output_frame: laser_frame
    lidar_to_rear_axle_m: 0.42

    lookahead_min_m: 0.7
    lookahead_max_m: 1.45
    lookahead_scale: 0.12

    max_range_m: 2.2
    scan_front_min_deg: -94.0
    scan_front_max_deg: 94.0

    publish_rate_hz: 10.0
    data_timeout_sec: 0.5
    path_point_stride: 5

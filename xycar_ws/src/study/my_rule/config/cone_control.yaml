/**:
  ros__parameters:
    scan_topic: /scan
    cone_cmd_topic: /my_rule/cone_cmd
    cone_cluster_topic: /my_rule/cone_clusters
    cone_lidar_cluster_topic: /my_rule/cone_lidar_clusters
    cone_fused_cluster_topic: /my_rule/cone_fused_clusters
    cone_path_topic: /my_rule/cone_path
    # Numeric schema is documented in cone_node.publish_diagnostics. The text
    # topic is convenient for live echo and both are useful in a rosbag.
    cone_diagnostics_topic: /my_rule/cone_diagnostics
    cone_status_topic: /my_rule/cone_status
    # The integrated semantic launch overrides this to true. Standalone cone
    # testing remains active without requiring a gate publisher.
    processing_gate_enabled: false
    processing_enabled_topic: /my_rule/cone_processing_enabled
    # Real semantic launches override this to true. The latest confirmed YOLO
    # cone boxes are cached, so LiDAR clustering remains at the native scan rate.
    cone_yolo_association_enabled: false
    object_detections_topic: /my_rule/object_detections
    camera_rect_balance: 0.3
    cone_yolo_box_timeout_sec: 0.75
    cone_yolo_min_confidence: 0.50
    # Preserve calibration tolerance here. The association step itself keeps
    # only the nearest LiDAR candidate per box, which removes rear candidates
    # without dropping near candidates at the edge of a box.
    cone_yolo_box_padding_ratio: 0.35
    cone_yolo_box_min_padding_px: 12.0
    # The 2-D LiDAR measures one horizontal plane, not cone height. Match the
    # projected camera bearing and do not reject a cone on vertical pixels.
    cone_yolo_match_vertical: false
    # If a bend hides one cone boundary from the camera, recover only a LiDAR
    # partner that forms a valid 0.68~0.98 m corridor around the previous path.
    # This keeps arbitrary chair/table legs excluded from the fused candidates.
    cone_yolo_recover_corridor_partner: true
    cone_yolo_recovered_centerline_max_deviation_m: 0.25
    # YOLO still unlocks cone entry. After the first camera-confirmed LiDAR
    # match, path geometry may use raw clusters close to the accepted corridor
    # so a 3 Hz camera inference cannot erase a 2-D LiDAR steering path.
    lidar_geometry_planning_enabled: true
    lidar_geometry_path_band_margin_m: 0.16
    # After control-path hold expires, retain only a short-lived geometry
    # reference so LiDAR can reacquire while a YOLO frame is late.
    lidar_geometry_reference_timeout_sec: 1.00
    max_range_m: 2.2
    min_range_m: 0.18
    scan_angle_offset_deg: 0.0
    scan_front_min_deg: -94.0
    scan_front_max_deg: 94.0
    dbscan_eps_m: 0.15
    dbscan_min_samples: 3
    sparse_dbscan_min_samples: 2
    sparse_cluster_min_range_m: 0.8
    sparse_cluster_min_intensity: 80.0
    sparse_cluster_match_distance_m: 0.18
    sparse_cluster_required_frames: 2
    sparse_cluster_history_frames: 3
    max_cone_diameter_m: 0.3
    angle_bin_deg: 6.0
    group_grow_distance_m: 0.5
    # Bridge at most one RC-scale missing-cone gap, and only when two existing
    # boundary points define a compatible forward tangent.
    boundary_gap_max_m: 0.85
    boundary_gap_max_turn_deg: 55.0
    seed_min_angle_deg: 15.0
    seed_max_angle_deg: 90.0
    seed_max_range_m: 2.2
    allow_single_boundary_fallback: true
    single_boundary_min_cones: 2
    single_boundary_min_span_m: 0.20
    single_boundary_switch_frames: 3
    # Once a previously valid path has expired, do not reacquire from only two
    # isolated points on one side. Normal single-boundary tracking is unchanged
    # while prev_path is alive; reacquisition needs one opposite-side supporter.
    single_boundary_reacquire_min_fused_clusters: 3
    single_boundary_reacquire_require_opposite_support: true
    single_boundary_confidence_cap: 0.60
    nearest_gate_confidence_cap: 0.40
    single_boundary_max_speed: 9.5
    lidar_to_rear_axle_m: 0.42
    wheelbase_m: 0.33
    lookahead_min_m: 0.7
    lookahead_max_m: 1.45
    lookahead_scale: 0.12
    far_preview_distance_m: 0.75
    far_preview_weight: 0.65
    steering_gain: 1.05
    max_steer_cmd: 42.0
    # Preserve the existing speed reduction curve while allowing more
    # steering headroom in tight cone turns.
    cone_speed_full_steer_deg: 26.0
    cone_speed: 17.0
    cone_min_drive_speed: 9.0
    cone_speed_steer_exponent: 1.0
    cone_speed_confidence_floor_ratio: 0.35
    cone_preview_speed_control: true
    cone_straight_boost_speed: 21.0
    cone_straight_boost_min_confidence: 0.75
    cone_straight_boost_min_path_distance_m: 1.35
    cone_straight_boost_full_angle_deg: 1.0
    cone_straight_boost_max_angle_deg: 3.0
    cone_speed_preview_near_m: 0.80
    cone_speed_preview_far_m: 1.45
    cone_speed_preview_samples: 4
    min_confidence: 0.3
    path_interpolation_method: linear
    path_sample_count: 100
    # Time is authoritative; frames remain only as a legacy fallback.
    path_hold_sec: 0.40
    path_hold_frames: 5
    pair_max_forward_delta_m: 0.30
    min_corridor_width_m: 0.68
    max_corridor_width_m: 0.98
    expected_corridor_width_m: 0.85
    # Learn slowly inside the measured 0.68~0.98 m RC-course bounds. A single
    # bad pair cannot move the estimate because two pairs are required.
    corridor_width_learning_enabled: true
    corridor_width_learning_alpha: 0.20
    corridor_width_max_update_m: 0.04
    corridor_width_learning_min_pairs: 2
    min_path_midpoints: 2
    min_path_span_m: 0.15
    path_gap_fill_start_m: 0.35
    path_gap_fill_max_m: 0.95
    path_gap_sample_spacing_m: 0.12
    max_path_target_jump_m: 0.30
    # Single-boundary target motion is limited per second, not per LiDAR scan.
    # The old per-scan value remains as a disabled-rate compatibility fallback.
    inferred_path_target_rate_mps: 0.80
    path_target_rate_max_dt_sec: 0.12
    inferred_max_path_target_jump_m: 0.08
    steering_median_window: 1
    # These rates retain RC-scale smoothing while avoiding a hidden dependence
    # on whether /scan arrives at 10 Hz or 20 Hz. Legacy per-frame values below
    # are used only if a rate is explicitly set to zero.
    steering_max_rate_deg_per_sec: 180.0
    inferred_steering_max_rate_deg_per_sec: 100.0
    steering_rate_max_dt_sec: 0.12
    steering_max_delta_deg: 14.0
    inferred_steering_max_delta_deg: 4.0
    allow_nearest_gate_fallback: true
    fallback_pair_min_lateral_separation_m: 0.4
    fallback_pair_max_center_offset_m: 0.65
    blind_recovery_frames: 10
    blind_recovery_min_clusters: 2
    blind_recovery_steer_decay: 0.92
    diagnostics_log_period_sec: 0.50

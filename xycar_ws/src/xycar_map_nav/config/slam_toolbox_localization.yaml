slam_toolbox:
  ros__parameters:
    use_sim_time: false
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    # Limit the influence of a single bad repeated-corridor constraint.
    ceres_loss_function: HuberLoss

    odom_frame: slam_odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /slam/scan_filtered
    mode: localization
    map_file_name: ""
    map_start_pose: [0.0, 0.0, 0.0]

    debug_logging: false
    resolution: 0.05
    min_laser_range: 0.21
    max_laser_range: 6.0
    minimum_time_interval: 0.10
    transform_publish_period: 0.02
    map_update_interval: 1.0
    transform_timeout: 0.20
    tf_buffer_duration: 30.0
    throttle_scans: 1
    scan_queue_size: 1
    stack_size_to_use: 40000000

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.08
    minimum_travel_heading: 0.08
    check_min_dist_and_heading_precisely: true

    # Localization keeps only a short rolling scan chain. A buffer of 100
    # allowed many visually similar corridor sections to compete at once.
    scan_buffer_size: 3
    scan_buffer_maximum_scan_distance: 1.0
    link_match_minimum_response_fine: 0.45
    link_scan_maximum_distance: 0.50

    # Repeated doors and walls must not create a distant loop candidate.
    do_loop_closing: true
    loop_search_maximum_distance: 0.75
    loop_match_minimum_chain_size: 5
    loop_match_maximum_variance_coarse: 0.50
    loop_match_minimum_response_coarse: 0.55
    loop_match_minimum_response_fine: 0.65

    correlation_search_space_dimension: 0.30
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.03

    loop_search_space_dimension: 0.80
    loop_search_space_resolution: 0.02
    loop_search_space_smear_deviation: 0.03

    distance_variance_penalty: 0.50
    angle_variance_penalty: 1.00
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.17453
    coarse_angle_resolution: 0.01745
    minimum_angle_penalty: 0.90
    minimum_distance_penalty: 0.50
    use_response_expansion: false

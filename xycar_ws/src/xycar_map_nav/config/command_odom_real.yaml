xycar_command_odom:
  ros__parameters:
    use_sim_time: false
    motor_topic: /xycar_motor
    odom_topic: /slam/odom
    odom_frame: slam_odom
    base_frame: base_footprint
    publish_rate_hz: 50.0
    command_timeout_sec: 0.30
    maximum_dt_sec: 0.10
    use_imu_yaw: true
    imu_topic: /imu
    imu_timeout_sec: 0.30
    imu_yaw_sign: 1.0
    imu_yaw_offset_rad: 0.0
    imu_rebase_when_stopped: true
    stopped_speed_threshold_mps: 0.02

    # Production baseline from the VESC real-vehicle dynamics tests.
    speed_gain_mps_per_command: 0.080612
    speed_deadzone_command: 3.0
    speed_min_mps: -4.0
    speed_max_mps: 8.0
    speed_delay_sec: 0.20
    speed_accel_tau_sec: 0.19
    speed_brake_tau_sec: 0.09
    steering_delay_sec: 0.10

    # Optional angular-rate fallback. Absolute IMU orientation is preferred.
    use_gyro_yaw: false
    gyro_z_bias_rad_s: 0.026983
    gyro_z_sign: -1.0
    gyro_z_scale: 1.061768
    gyro_low_pass_alpha: 0.35
    gyro_command_blend: 0.65
    gyro_timeout_sec: 0.15

    steering_map_commands:
      [-42.0, -40.0, -35.0, -30.0, -20.0, -10.0, 0.0,
       10.0, 20.0, 30.0, 35.0, 40.0, 42.0]
    steering_map_curvatures:
      [1.502435, 1.383494, 1.174860, 0.922781, 0.552809,
       0.194230, 0.0, -0.556883, -0.959829, -1.369323,
       -1.601706, -1.853397, -1.939236]

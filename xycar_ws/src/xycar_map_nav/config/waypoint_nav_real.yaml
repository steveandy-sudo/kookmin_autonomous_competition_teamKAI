xycar_waypoint_nav:
  ros__parameters:
    use_sim_time: false

    frame_id: map
    base_frame_id: base_footprint
    closed_route: true

    # Keep false until TF, path, steering sign, and both rule handovers have
    # passed the lifted-wheel and low-speed tests.
    drive_enabled: false
    inflation_radius_m: 0.23
    unknown_is_occupied: true
    waypoint_snap_radius_m: 0.45
    path_spacing_m: 0.10
    path_smoothing_enabled: true
    path_smoothing_data_weight: 0.0005
    path_smoothing_weight: 0.45
    path_smoothing_iterations: 2500
    path_smoothing_anchor_weight: 0.02
    clearance_cost_weight: 3.0
    clearance_cost_decay_m: 0.35
    csv_path_smoothing_enabled: true
    csv_path_smoothing_data_weight: 0.10
    csv_path_smoothing_weight: 0.40
    csv_path_smoothing_iterations: 100

    goal_tolerance_m: 0.25
    cruise_speed_command: 5.0
    minimum_speed_command: 3.0
    curve_slowdown_curvature_per_m: 0.80
    speed_gain_mps_per_command: 0.080612
    maximum_lateral_accel_mps2: 0.90
    # Do not accelerate out of a curve until pose and path are aligned.
    speed_alignment_cross_track_soft_m: 0.05
    speed_alignment_cross_track_hard_m: 0.20
    speed_alignment_heading_soft_rad: 0.08
    speed_alignment_heading_hard_rad: 0.35
    speed_acceleration_rate_command_per_sec: 5.0
    speed_deceleration_rate_command_per_sec: 30.0
    control_rate_hz: 20.0
    pose_timeout_sec: 0.25

    # Speed-adaptive Stanley controller. It uses the measured VESC/IMU odom
    # speed and projects the front axle by the measured steering delay.
    odom_topic: /slam/odom
    odom_timeout_sec: 0.35
    localization_odom_frame_id: slam_odom

    # A single scan match must never move the controller by a lane width.
    # Brief outliers are dead-reckoned with slam_odom; persistent jumps stop
    # motor output and require localization to be checked before reset.
    localization_guard_enabled: true
    localization_maximum_translation_jump_m: 0.20
    localization_maximum_yaw_jump_deg: 5.0
    localization_jump_fault_after_sec: 0.30
    localization_guard_status_topic: /map_nav/localization_guard/status
    localization_guard_debug_topic: /map_nav/localization_guard/debug

    wheelbase_m: 0.32
    front_axle_offset_m: 0.16
    steering_delay_sec: 0.10
    stanley_gain: 1.20
    stanley_softening_mps: 0.45
    stanley_heading_gain: 1.0
    straight_stanley_gain: 0.45
    straight_stanley_softening_mps: 0.80
    straight_stanley_heading_gain: 0.55
    curvature_feedforward_gain: 0.50
    path_heading_window_m: 0.40
    path_heading_preview_m: 0.0
    path_curvature_window_m: 0.55
    path_curvature_preview_m: 0.10
    maximum_steering_angle_rad: 0.62

    # Localization jitter is filtered gently on straights. Curves retain a
    # faster steering response so filtering does not delay corner entry.
    straight_curvature_threshold_per_m: 0.16
    straight_steering_rate_command_per_sec: 90.0
    curve_steering_rate_command_per_sec: 300.0
    straight_steering_filter_sec: 0.16
    curve_steering_filter_sec: 0.04
    straight_yaw_rate_damping_sec: 0.45
    curve_yaw_rate_damping_sec: 0.12

    motor_topic: /xycar_motor
    shadow_motor_topic: /map_nav/xycar_motor_shadow
    path_topic: /map_nav/global_path
    waypoint_marker_topic: /map_nav/waypoints
    control_mode_topic: /map_nav/control_mode
    mission_reason_topic: /map_nav/mission_reason
    debug_topic: /map_nav/debug

    scan_topic: /scan
    clicked_point_topic: /clicked_point
    scan_required_for_drive: true
    emergency_stop_distance_m: 0.38
    emergency_front_half_angle_deg: 15.0
    scan_timeout_sec: 0.50

    # Global path is the normal controller. A mission override is accepted
    # only when camera semantics and fresh LiDAR geometry agree.
    mission_trigger_mode: semantic
    semantic_timeout_sec: 0.75
    mission_lidar_timeout_sec: 0.50
    object_detections_topic: /my_rule/object_detections
    vehicle_camera_lidar_hfov_deg: 60.0
    vehicle_camera_lidar_padding_deg: 3.0
    object_lidar_min_points: 2

    # Camera cone + a clustered LiDAR cone at 0.50m enters the cone rule.
    cone_class_names: [cone]
    cone_camera_required_frames: 2
    cone_camera_min_count: 1
    cone_camera_min_confidence: 0.50
    cone_cluster_topic: /my_rule/cone_clusters
    cone_lidar_min_count: 1
    cone_entry_distance_m: 0.50
    cone_minimum_duration_sec: 1.0
    cone_clear_hold_sec: 0.70
    # Start the expensive cone LiDAR planner on the first valid YOLO cone.
    # Keep it warm briefly through camera flicker and for the active mission.
    cone_processing_hold_sec: 1.50
    cone_processing_enabled_topic: /my_rule/cone_processing_enabled
    cone_command_topic: /my_rule/cone_cmd
    cone_command_timeout_sec: 0.35
    cone_command_min_confidence: 0.30
    cone_speed_cap_command: 9.5
    cone_input_is_physical_angle: true
    cone_steering_actual_deg: [0.0, 4.0, 10.0, 16.0, 26.0]
    cone_steering_commands: [0.0, 10.0, 20.0, 30.0, 42.0]

    # Until an obstacle-only model is finalized, both repository vehicle
    # labels are accepted. LiDAR distance still has to pass the entry gate.
    vehicle_class_names: [obstacle_vehicle, car]
    vehicle_camera_required_frames: 2
    vehicle_camera_min_count: 1
    vehicle_camera_min_confidence: 0.45
    vehicle_entry_distance_m: 2.40
    vehicle_minimum_duration_sec: 0.50
    vehicle_clear_hold_sec: 0.50

    # Red and yellow latch a stop after two detector frames. Only a confirmed
    # green releases it. Lane-departure intervention remains postponed.
    traffic_control_enabled: true
    traffic_required_frames: 2
    traffic_min_confidence: 0.50
    traffic_signal_max_center_y_ratio: 0.55
    lane_intervention_enabled: false

    # Optional four-camera vehicle counts improve pass/return state changes.
    # With only front-camera semantics, clear timeout returns to the path.
    dynamic_counts_topic: /yolo_obstacle/stable_counts
    dynamic_detector_timeout_sec: 0.60
    dynamic_detector_required: false
    dynamic_right_offset_m: 0.28
    dynamic_left_offset_m: 0.28
    dynamic_offset_rate_mps: 0.35
    dynamic_speed_limit_command: 4.0
    dynamic_front_trigger: 1
    dynamic_behind_passed_trigger: 1
    dynamic_behind_return_trigger: 2
    dynamic_clear_reset_sec: 0.50

    # Temporary model-free obstacle fallback. It only accepts multi-ray LiDAR
    # clusters intersecting the vehicle-width corridor around the global path.
    # Disable this after obstacle YOLO + LiDAR association is validated.
    lidar_obstacle_fallback_enabled: true
    lidar_obstacle_debug_topic: /map_nav/lidar_obstacle_debug
    lidar_obstacle_detect_distance_m: 1.50
    lidar_obstacle_minimum_distance_m: 0.18
    lidar_obstacle_path_half_width_m: 0.18
    lidar_obstacle_minimum_cluster_points: 3
    lidar_obstacle_maximum_scan_index_gap: 2
    lidar_obstacle_maximum_cluster_gap_m: 0.16
    lidar_obstacle_minimum_cluster_width_m: 0.09
    lidar_obstacle_maximum_cluster_width_m: 0.70
    lidar_obstacle_side_probe_inner_m: 0.18
    lidar_obstacle_side_probe_outer_m: 0.55
    lidar_obstacle_lidar_x_m: 0.065
    lidar_obstacle_lidar_y_m: 0.0
    lidar_obstacle_lidar_yaw_deg: 0.0
    lidar_obstacle_required_frames: 2
    lidar_obstacle_left_offset_m: 0.28
    lidar_obstacle_right_offset_m: 0.28
    lidar_obstacle_offset_rate_mps: 0.45
    lidar_obstacle_speed_limit_command: 4.0
    lidar_obstacle_estimated_length_m: 0.35
    lidar_obstacle_post_margin_m: 0.45
    lidar_obstacle_clear_hold_sec: 0.25
    lidar_obstacle_return_deadband_m: 0.02
    lidar_obstacle_center_deadband_m: 0.04

    # Real steering calibration already used by canonical rule driving.
    steering_map_commands:
      [-42.0, -40.0, -35.0, -30.0, -20.0, -10.0, 0.0,
       10.0, 20.0, 30.0, 35.0, 40.0, 42.0]
    steering_map_curvatures:
      [1.502435, 1.383494, 1.174860, 0.922781, 0.552809,
       0.194230, 0.0, -0.556883, -0.959829, -1.369323,
       -1.601706, -1.853397, -1.939236]

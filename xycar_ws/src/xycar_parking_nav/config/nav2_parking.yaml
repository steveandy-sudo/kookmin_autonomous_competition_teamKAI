amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.08
    alpha2: 0.08
    alpha3: 0.10
    alpha4: 0.10
    alpha5: 0.10
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: slam_odom
    scan_topic: /slam/scan_filtered
    map_topic: map
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field_prob
    laser_likelihood_max_dist: 1.0
    laser_min_range: 0.20
    laser_max_range: 6.0
    max_beams: 120
    min_particles: 500
    max_particles: 3000
    pf_err: 0.03
    pf_z: 0.99
    sigma_hit: 0.12
    z_hit: 0.80
    z_rand: 0.20
    z_max: 0.0
    z_short: 0.0
    do_beamskip: true
    beam_skip_distance: 0.30
    beam_skip_threshold: 0.30
    beam_skip_error_threshold: 0.90
    # Update while stationary so the pre-drive localization gate can collect
    # independent LiDAR-corrected samples before motor authorization.
    update_min_d: 0.0
    update_min_a: 0.0
    resample_interval: 1
    transform_tolerance: 0.20
    tf_broadcast: true
    save_pose_rate: 1.0
    set_initial_pose: true
    always_reset_initial_pose: true
    initial_pose:
      # Official center pose (1.8, 0.9, pi), converted to front-wheel base.
      x: 1.64
      y: 0.9
      z: 0.0
      yaw: 3.141592653589793


controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.50
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [parking_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.06
      movement_time_allowance: 8.0
    parking_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.08
    FollowPath:
      # Predictive Ackermann tracking with explicit path-inversion handling.
      # Mission stages also terminate at the important direction/curvature
      # boundaries so the optimizer cannot round a parking cusp.
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      iteration_count: 1
      vx_std: 0.16
      vy_std: 0.0
      wz_std: 0.32
      vx_max: 0.28
      vx_min: -0.28
      vy_max: 0.0
      wz_max: 0.55
      temperature: 0.25
      gamma: 0.015
      motion_model: Ackermann
      visualize: false
      retry_attempt_limit: 2
      prune_distance: 1.20
      transform_tolerance: 0.20
      enforce_path_inversion: true
      inversion_xy_tolerance: 0.08
      inversion_yaw_tolerance: 0.16
      AckermannConstraints:
        min_turning_r: 0.67
      critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.5
        critical_cost: 300.0
        collision_cost: 1000000.0
        consider_footprint: true
        near_goal_distance: 0.35
        inflation_layer_name: inflation_layer
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        threshold_to_consider: 0.80
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        threshold_to_consider: 0.35
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 18.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.35
        offset_from_furthest: 10
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        offset_from_furthest: 4
        threshold_to_consider: 0.80
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 3
        threshold_to_consider: 0.35
        max_angle_to_furthest: 0.80
        forward_preference: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: slam_odom
      robot_base_frame: base_footprint
      rolling_window: true
      # Humble declares these parameters as integers.
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[-0.46, -0.18], [0.11, -0.18], [0.11, 0.18], [-0.46, 0.18]]"
      # 45 mm physical clearance plus one 50 mm occupancy-grid localization
      # cell. This prevents a biased map pose from cutting a wall corner that
      # the base-frame LiDAR shield would correctly reject.
      footprint_padding: 0.095
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /slam/scan_filtered
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_min_range: 0.20
          obstacle_max_range: 5.0
          raytrace_min_range: 0.20
          raytrace_max_range: 6.0
          max_obstacle_height: 1.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # Must cover the 0.205 m padded inscribed radius reported by Nav2.
        inflation_radius: 0.21
        cost_scaling_factor: 10.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[-0.46, -0.18], [0.11, -0.18], [0.11, 0.18], [-0.46, 0.18]]"
      # Physical clearance plus one map/localization cell, as above.
      footprint_padding: 0.095
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /slam/scan_filtered
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_min_range: 0.20
          obstacle_max_range: 5.0
          raytrace_min_range: 0.20
          raytrace_max_range: 6.0
          max_obstacle_height: 1.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # Must cover the 0.205 m padded inscribed radius reported by Nav2.
        inflation_radius: 0.21
        cost_scaling_factor: 10.0
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.196
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerHybrid
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.08
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1500
      max_planning_time: 5.0
      motion_model_for_search: REEDS_SHEPP
      angle_quantization_bins: 72
      analytic_expansion_ratio: 2.5
      analytic_expansion_max_length: 2.60
      # Use the weaker measured steering side (1 / 1.502435 = 0.666 m).
      minimum_turning_radius: 0.67
      reverse_penalty: 1.35
      change_penalty: 0.20
      non_straight_penalty: 1.10
      cost_penalty: 2.2
      retrospective_penalty: 0.015
      lookup_table_size: 7.5
      cache_obstacle_heuristic: true
      smooth_path: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # Humble eagerly loads its built-in NavigateThroughPoses BT during
    # activation and requires these servers to exist. The parking manager
    # always sends ackermann_navigate_to_pose.xml, which never calls them.
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: slam_odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.20
    simulate_ahead_time: 1.0

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 500

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.32, 0.0, 0.65]
    min_velocity: [-0.32, 0.0, -0.65]
    max_accel: [0.60, 0.0, 1.5]
    max_decel: [-0.80, 0.0, -1.5]
    odom_topic: /slam/odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.30

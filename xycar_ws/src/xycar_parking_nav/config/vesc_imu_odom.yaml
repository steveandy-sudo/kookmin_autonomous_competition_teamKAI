vesc_imu_odom:
  ros__parameters:
    use_sim_time: false
    vesc_topic: /vehicle/vesc_state
    imu_topic: /imu
    odom_topic: /slam/odom
    odom_frame: slam_odom
    base_frame: base_footprint
    publish_tf: true
    use_tachometer: true
    # Median of five measured 5.00 m trials (CV 1.65%).
    meters_per_tachometer_count: 0.002527806
    tachometer_sign: 1.0
    maximum_tachometer_step_counts: 1000.0
    fallback_to_speed_on_tachometer_jump: true
    speed_scale: 1.0
    speed_offset_mps: 0.0
    speed_deadband_mps: 0.02
    maximum_speed_mps: 1.0
    maximum_dt_sec: 0.10
    imu_yaw_source: gyro_z
    imu_yaw_sign: 1.0
    gyro_yaw_sign: -1.0
    gyro_yaw_scale: 0.955
    gyro_z_bias_rad_s: 0.030
    gyro_deadband_rad_s: 0.015
    gyro_bias_adaptation_enabled: true
    gyro_bias_stationary_speed_mps: 0.03
    gyro_bias_stationary_hold_sec: 2.0
    gyro_bias_time_constant_sec: 5.0
    gyro_bias_max_residual_rad_s: 0.08
    gyro_bias_vesc_timeout_sec: 0.25
    imu_timeout_sec: 0.15
    imu_hard_timeout_sec: 0.50
    maximum_imu_yaw_step_rad: 0.35
    require_initial_imu: true
    pose_xy_variance: 0.04
    pose_yaw_variance: 0.02
    twist_linear_variance: 0.02
    twist_yaw_variance: 0.03
    stale_covariance_multiplier: 25.0

parking_scan_filter:
  ros__parameters:
    use_sim_time: false
    input_topic: /scan
    output_topic: /slam/scan_filtered
    minimum_range_m: 0.20
    maximum_range_m: 6.0

